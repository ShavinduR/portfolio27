<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8" />
    <!-- Detail pages live one folder deep; resolve every relative link from the site root. -->
    <base href="../">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <!--seo--><!--/seo-->
    <meta name="theme-color" content="#070709">
    <link rel="manifest" href="site.webmanifest">

    <script src="assets/js/theme.js"></script>
    <link rel="preload" href="assets/fonts/montserrat-800.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="assets/fonts/poppins-400.woff2" as="font" type="font/woff2" crossorigin>

<!-- GENERATED by scripts/prerender.mjs from scripts/templates/detail.html. Don't edit; edit the data files and run `npm run build`. -->
<body data-page="{{page}}" data-nav="work" data-slug="{{slug}}" class="bg-bg text-fg font-body flex flex-col min-h-screen transition-colors duration-300">
    <a href="{{self}}#main" class="sr-only focus:not-sr-only focus:fixed focus:top-3 focus:left-3 focus:z-[60] btn btn-primary">Skip to content</a>

    <header data-layout="nav"></header>

    <main id="main" data-render="{{mount}}" data-build="{{hash}}"><!--render-->{{content}}<!--/render--></main>

    <footer data-layout="footer" id="contact"></footer>

    <script src="assets/js/data/profile.js"></script>
    <script src="assets/js/data/case-studies.js"></script>
    <script src="assets/js/data/projects.js"></script>
    <script src="assets/js/data/images.js"></script>
    <script src="assets/js/components.js"></script>
